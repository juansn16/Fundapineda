server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sin esto, recargar en /noticias o /servicios devuelve 404: nginx busca un
    # archivo fisico que no existe porque es una ruta de React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos con hash en el nombre se pueden cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Los metadatos del sitio no deben cachearse o los cambios no se propagan
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml+rss;

    # Cabeceras de seguridad basicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
}
