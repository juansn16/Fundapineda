# FundaPineda - sitio de produccion (nginx)
# Aplica para dominio: fundapineda.org (+ www)
#
# Instalacion: copiar a /etc/nginx/sites-available/fundapineda y enlazar a
# /etc/nginx/sites-enabled/, luego: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name fundapineda.org www.fundapineda.org;

    root /var/www/fundapineda;
    index index.html;

    server_tokens off;
    client_max_body_size 20m;

    # --- Proxy a la API (uvicorn en 127.0.0.1:8000) ---
    # Prefijos usados por el backend: /auth, /reports, /admin/*, /noticias,
    # /contacto, /user y /health. El regex tiene precedencia sobre try_files.
    location ~ ^/(auth|reports|admin|noticias|contacto|user|health)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Exportes de reportes pueden tardar; no cortar la conexion
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # --- SPA (React Router): recargar en /noticias o /servicios no debe dar 404 ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos con hash en el nombre se cachean para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Los metadatos no deben cachearse o los cambios no se propagan
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml+rss;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
}

# HTTPS: una vez emitido el certificado, Certbot agrega aqui el bloque :443 y
# la redireccion http->https. No editar manualmente ese bloque (lo gestiona
# certbot --nginx).